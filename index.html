<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>LivaAware</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#F5F7FA;--s:#EAF3F7;--b:#D5E0E8;--a:#7892A5;--d:#142D45;--c:#FFFFFF;--t:#263B50;--r:#b3261e;--g:#142D45;--pg:#EAF3F7;--lv:#D3EEF1;--bl:#D6F1F4;--pm:#39B8C6;--p:#167D91;--sp:#39B8C6;--nv:#142D45;--cy:#39B8C6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1b27;--s:#1a2b3b;--b:#2c4256;--a:#8fa8ba;--d:#EAF3F7;--c:#16273a;--t:#dbe6ee;--r:#ff8a80;--g:#0b1a28;--pg:#1b3040;--lv:#21394a;--bl:#1f4650;--pm:#39B8C6;--p:#1b93a9;--sp:#39B8C6;--nv:#0b1a28;--cy:#39B8C6}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--t);font:16px/1.6 "Segoe UI",Tahoma,"Noto Naskh Arabic",system-ui,sans-serif;display:flex;min-height:100vh}
aside{width:270px;background:var(--nv);border-inline-end:1px solid var(--b);padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:14px}.brand img{width:52px;height:52px;object-fit:contain;border-radius:50%;background:#fff;padding:3px;border:2px solid var(--sp)}.brand b{font-size:20px;color:#fff}.brand small{display:block;color:#9fb6c8;font-size:11px;line-height:1.3}
nav button{display:flex;align-items:center;justify-content:space-between;width:100%;gap:10px;background:none;border:0;border-radius:10px;padding:10px 12px;font:inherit;color:#E6EEF4;cursor:pointer;text-align:start}
nav button:hover{background:rgba(57,184,198,.22)}nav button.on{background:var(--cy);color:#142D45}nav button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--a);outline-offset:2px}
main{flex:1;padding:28px;min-width:0;max-width:980px}h1{color:var(--d);margin:0 0 4px;font-size:26px}h2{color:var(--d);font-size:18px;margin:18px 0 8px}
.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.big{font-size:34px;color:var(--d);font-weight:700;line-height:1.1}.mut{color:var(--a);font-size:14px}
label{display:block;font-size:14px;color:var(--d);margin:10px 0 3px}input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--b);border-radius:9px;background:var(--bg);color:var(--t);font:inherit}
.btn{background:var(--p);color:#fff;border:0;border-radius:10px;padding:9px 16px;font:inherit;cursor:pointer;margin-top:10px}.btn.o{background:var(--nv);color:#fff;border:0}
.w{border-inline-start:5px solid var(--sp);background:var(--c);border-radius:10px;padding:10px 14px;margin:8px 0}.w.Major,.w.Contraindicated{border-color:var(--r)}.w b{color:var(--d)}
.chk{display:inline-flex;align-items:center;gap:6px;margin:4px 12px 4px 0;font-size:15px}.chk input{width:auto}
table{width:100%;border-collapse:collapse}td,th{padding:7px;border-bottom:1px solid var(--b);text-align:start;font-size:15px}
.tag{display:inline-block;background:var(--bl);color:var(--d);border-radius:20px;padding:1px 10px;font-size:13px}
#toast{position:fixed;inset-inline:16px;bottom:16px;background:var(--p);color:#fff;padding:12px 16px;border-radius:12px;display:none;z-index:9}
@media(max-width:760px){body{display:block}aside{width:100%;height:auto;position:static;flex-direction:column}nav{display:flex;overflow-x:auto;gap:4px}nav button{white-space:nowrap;width:auto}main{padding:16px}}
body.out aside,body.out main{display:none}body:not(.out) #land{display:none}#land{flex:1;min-width:0;padding:0 28px 40px}
.lh{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:18px 0}.lb{display:flex;align-items:center;gap:10px;color:var(--d);font-size:20px}.lb img{width:44px;height:44px;object-fit:contain;border-radius:50%;background:#fff;padding:3px;border:2px solid var(--sp)}main .card{border-top:3px solid var(--cy)}main[data-s=aw] .card{border-top-color:var(--lv)}main[data-s=aw] h2{background:var(--lv);padding:6px 14px;border-radius:10px}main[data-s=dash] h2,main[data-s=prof] h2,main[data-s=meds] h2,main[data-s=safe] h2,main[data-s=lib] h2,main[data-s=rem] h2,main[data-s=rep] h2{background:var(--pg);padding:6px 14px;border-radius:10px}.tabs button:hover{background:var(--lv)}
.ln{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.ll{background:none;border:0;font:inherit;color:var(--d);cursor:pointer;padding:6px 8px}.sm{margin:0;padding:8px 18px}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center;margin-top:10px}.ht h1{font-size:clamp(34px,5vw,58px);line-height:1.3}.ht p{font-size:18px;max-width:34em}
.hv{position:relative;border-radius:22px;min-height:420px;display:grid;place-items:center}.circ{width:min(340px,80%);aspect-ratio:1;border-radius:50%;background:#fff;border:2px solid var(--sp);box-shadow:0 8px 30px rgba(89,68,83,.12);overflow:hidden;display:grid;place-items:center}.circ img{width:84%}
.fc{position:absolute;background:#fff;color:#263B50;border:1px solid var(--sp);border-radius:14px;padding:10px 16px;max-width:230px;font-size:14px}.fc b{color:var(--d);font-size:16px}.f1{top:6%;inset-inline-start:6%}.f2{bottom:6%;inset-inline-end:6%}.af{max-width:440px;margin:30px auto}#land section{margin-top:34px}
@media(max-width:760px){.hero{grid-template-columns:1fr}#land{padding:0 16px 30px}}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:10px 0}.tabs button{border:1px solid var(--b);background:var(--c);color:var(--d);border-radius:20px;padding:6px 14px;font:inherit;cursor:pointer;white-space:nowrap}.tabs button.on{background:var(--cy);color:#142D45}.bar{height:8px;background:var(--s);border-radius:8px;margin:8px 0;overflow:hidden}.bar i{display:block;height:100%;background:var(--pm);border-radius:8px;transition:width .4s}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}@keyframes fs{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.circ{animation:fl 4s ease-in-out infinite}.brand img,.lb img{animation:fs 3.5s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.circ,.brand img,.lb img{animation:none}}.circ img{width:94%}
@media print{aside,.np{display:none!important}body{display:block;background:#fff}.card{break-inside:avoid}}
</style></head><body>
